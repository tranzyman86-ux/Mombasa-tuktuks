backend:
  name: github
  repo: tranzyman86/tuktuks  # change to your github repo name
  branch: main
  base_url: https://api.netlify.com  # THIS IS THE KEY
  auth_endpoint: /auth

media_folder: "static/images"
public_folder: "/images"

collections:
    - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    fields:
            - {label: "Title", name: "title", widget: "string"}
            - {label: "Body", name: "body", widget: "markdown"}
